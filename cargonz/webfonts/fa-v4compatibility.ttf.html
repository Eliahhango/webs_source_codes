<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ON3STEP — Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #0f1c2e, #05070d);
  color: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.container {
  text-align: center;
  max-width: 520px;
  padding: 20px;
}

/* LOGO STYLE (metal + glow) */
.logo {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 4px;
  margin-bottom: 30px;
  background: linear-gradient(90deg, #cfd9df, #5dade2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* HEADLINE */
h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

/* SUBTEXT */
.subtitle {
  font-size: 16px;
  color: #9ca3af;
  margin-bottom: 30px;
}

/* BLUE LINE */
.divider {
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, #5dade2, transparent);
  margin: 25px auto;
}

/* DESCRIPTION */
.desc {
  font-size: 15px;
  color: #6b7280;
  line-height: 1.6;
}

/* FOOTER */
.footer {
  margin-top: 50px;
  font-size: 12px;
  color: #4b5563;
}

/* SUBTLE GLOW EFFECT */
.container::before {
  content: "";
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(93,173,226,0.15), transparent 70%);
  z-index: -1;
  filter: blur(60px);
}

@media (max-width: 600px) {
  h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">ON3STEP</div>

  <h1>Coming Soon</h1>

  <div class="divider"></div>

  <div class="subtitle">Interactive Themes & Templates</div>

  <div class="desc">
    We are building something elegant and powerful.<br>
    Stay tuned — your next experience is coming.
  </div>

  <div class="footer">
    © 2026 ON3STEP. All Rights Reserved.
  </div>

</div>

</body>
</html>
